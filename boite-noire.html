<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lecteur de boîte noire</title>
<style>
  :root { --g:#33ff66; --gd:#0b5f22; --red:#ff2a2a; }
  * { box-sizing:border-box; margin:0; padding:0; }
  html,body { height:100%; background:#000; color:var(--g); font-family:"Courier New",monospace; overflow:hidden; }
  body { text-shadow:0 0 8px var(--g); }
  .screen { position:fixed; inset:0; display:none; flex-direction:column; align-items:center; justify-content:center; gap:4vh; padding:4vh 5vw; text-align:center; }
  .screen.on { display:flex; }
  .scan::before { content:""; position:fixed; inset:0; pointer-events:none;
    background:repeating-linear-gradient(0deg, rgba(0,0,0,.25) 0 2px, transparent 2px 4px); }
  h1 { font-size:clamp(24px,4.5vw,64px); letter-spacing:.15em; }
  .badge { font-size:clamp(14px,2vw,26px); letter-spacing:.3em; opacity:.8; }

  /* Préparation (animateur) */
  #setup { gap:3vh; }
  #setup p { font-size:clamp(14px,1.8vw,22px); max-width:60ch; line-height:1.5; color:#9fffb8; text-shadow:none; }
  .btn { font-family:inherit; font-weight:bold; font-size:clamp(16px,2.2vw,28px); color:var(--g); background:#000;
    border:3px solid var(--g); border-radius:12px; padding:2vh 3vw; cursor:pointer; text-shadow:0 0 6px var(--g); }
  .btn:hover { background:var(--gd); }
  #fileName { font-size:clamp(13px,1.6vw,20px); color:#fff; text-shadow:none; min-height:1.2em; }

  /* Attente */
  .blink { animation:blink 1s steps(1) infinite; }
  @keyframes blink { 50% { opacity:0; } }
  .box { width:min(40vw,40vh); aspect-ratio:1.4; border:4px solid var(--g); border-radius:10px; position:relative;
    box-shadow:0 0 30px var(--gd) inset; display:flex; align-items:center; justify-content:center; font-size:clamp(18px,3vw,40px); }
  .box::after { content:""; position:absolute; right:-14%; top:42%; width:14%; height:16%; border:4px solid var(--g); border-left:none; }
  #go { font-family:inherit; font-weight:900; font-size:clamp(28px,6vw,90px); letter-spacing:.1em; color:#fff; background:var(--red);
    border:none; border-radius:24px; padding:3vh 6vw; cursor:pointer; text-shadow:0 3px 0 rgba(0,0,0,.4);
    box-shadow:0 10px 0 #8a0000, 0 0 40px rgba(255,42,42,.7); animation:pulse 1.2s ease-in-out infinite; }
  #go:active { transform:translateY(6px); box-shadow:0 4px 0 #8a0000; }
  @keyframes pulse { 50% { box-shadow:0 10px 0 #8a0000, 0 0 70px rgba(255,42,42,1); } }

  /* Analyse */
  #log { width:min(80vw,1000px); text-align:left; font-size:clamp(16px,2.4vw,32px); line-height:1.6; min-height:8em; }
  #bar { width:min(80vw,1000px); height:4.5vh; border:3px solid var(--g); border-radius:8px; overflow:hidden; }
  #fill { height:100%; width:0; background:repeating-linear-gradient(90deg, var(--g) 0 18px, #1faa48 18px 24px); box-shadow:0 0 20px var(--g); }
  #pct { font-size:clamp(28px,5vw,72px); font-weight:bold; }

  /* Vidéo */
  #vidScreen { padding:0; background:#000; }
  video { width:100vw; height:100vh; object-fit:contain; background:#000; }

  #endScreen h1 { color:var(--red); text-shadow:0 0 12px var(--red); }
  #hint { position:fixed; bottom:8px; right:12px; font-size:12px; color:#2e7a45; text-shadow:none; }
</style>
</head>
<body class="scan">

<input type="file" id="file" accept="video/*" hidden>

<!-- 2. Attente du branchement -->
<section class="screen on" id="wait">
  <div class="badge">★ POLICE DE L'AIR DES FARFADETS ★ ANALYSE DES ÉPAVES ★</div>
  <div class="box">⬛ BOÎTE NOIRE</div>
  <h1 class="blink">BRANCHEZ LA BOÎTE NOIRE…</h1>
  <button id="go">ANALYSER</button>
</section>

<!-- 3. Fausse analyse -->
<section class="screen" id="scan">
  <div class="badge">★ ANALYSE EN COURS ★</div>
  <div id="log"></div>
  <div id="bar"><div id="fill"></div></div>
  <div id="pct">0 %</div>
</section>

<!-- 4. Vidéo -->
<section class="screen" id="vidScreen"><video id="vid" playsinline></video></section>

<!-- 5. Fin -->
<section class="screen" id="endScreen">
  <div class="badge">★ POLICE DE L'AIR DES FARFADETS ★</div>
  <h1>FIN DE L'ENREGISTREMENT</h1>
  <div style="font-size:clamp(18px,3vw,40px)">Signal perdu…</div>
</section>


<script>
const $ = id => document.getElementById(id);
function show(id) { document.querySelectorAll(".screen").forEach(s => s.classList.toggle("on", s.id === id)); }

// Sons
let ac = null;
function tone(f, d, type = "square", v = .12) {
  try {
    ac = ac || new (window.AudioContext || window.webkitAudioContext)();
    const o = ac.createOscillator(), g = ac.createGain();
    o.type = type; o.frequency.value = f;
    g.gain.setValueAtTime(v, ac.currentTime); g.gain.exponentialRampToValueAtTime(.001, ac.currentTime + d);
    o.connect(g); g.connect(ac.destination); o.start(); o.stop(ac.currentTime + d + .02);
  } catch (e) {}
}
const wait = ms => new Promise(r => setTimeout(r, ms));

// Chargement : boite-noire.mp4 à côté de la page ; sinon, choix manuel au premier clic sur ANALYSER
let videoOK = false, videoURL = null;
const v0 = $("vid");
v0.addEventListener("loadedmetadata", () => { videoOK = true; }, { once: true });
v0.src = "boite-noire.mp4"; v0.load();
$("file").onchange = e => {
  const f = e.target.files[0]; if (!f) return;
  videoURL = URL.createObjectURL(f); $("vid").src = videoURL; $("vid").load(); videoOK = true; analyse();
};
// Plein écran au premier clic ou à la première touche
let fs = false;
function goFull() {
  if (fs) return; fs = true;
  try { document.documentElement.requestFullscreen && document.documentElement.requestFullscreen().catch(() => {}); } catch (e) {}
}
addEventListener("pointerdown", goFull, true);
addEventListener("keydown", goFull, true);

// Analyse
let running = false;
const STEPS = [
  [0,  "> Connexion au port de la boîte noire…"],
  [12, "> Boîte noire détectée : montgolfière « T&P-01 »"],
  [28, "> Vérification des circuits… OK"],
  [45, "> Décryptage des données…"],
  [70, "> Récupération de l'enregistrement audio…"],
  [90, "> Dernières secondes avant le crash…"],
  [100,"> LECTURE !"]
];
async function analyse() {
  if (running) return;
  if (!videoOK) { $("file").click(); return; }
  running = true;
  show("scan"); $("log").innerHTML = ""; $("fill").style.width = "0"; $("pct").textContent = "0 %";
  const total = 9000, t0 = performance.now(); let shown = 0;
  await new Promise(res => {
    const tick = () => {
      const p = Math.min(100, (performance.now() - t0) / total * 100);
      $("fill").style.width = p + "%"; $("pct").textContent = Math.floor(p) + " %";
      while (shown < STEPS.length && p >= STEPS[shown][0]) {
        const line = document.createElement("div"); line.textContent = STEPS[shown][1];
        $("log").appendChild(line); tone(shown === STEPS.length - 1 ? 1200 : 880, .12); shown++;
      }
      if (Math.random() < .08) tone(300 + Math.random() * 900, .04, "square", .05);
      p < 100 ? requestAnimationFrame(tick) : res();
    };
    tick();
  });
  await wait(900);
  show("vidScreen");
  const v = $("vid"); v.currentTime = 0;
  try { await v.play(); } catch (e) { v.controls = true; }
}
$("go").onclick = analyse;
$("vid").onended = () => { show("endScreen"); tone(220, 1.2, "sawtooth", .1); running = false; };

// Clavier / télécommande
addEventListener("keydown", e => {
  if ((e.key === " " || e.key === "Enter" || e.key === "PageDown" || e.key === "ArrowRight") && $("wait").classList.contains("on")) {
    e.preventDefault(); analyse();
  }
  if (e.key === "Escape") {
    const v = $("vid"); v.pause(); v.controls = false; running = false; show("wait");
  }
});
</script>
</body>
</html>
